{% extends "base_chat.html" %}

{% block title %}
    Chat ({{chat.name}})
{% endblock title %}

{% block desc %}
    <h5>Name: {{chat.name}}</h5>
    {% for member in chat.members.all %}
        <a href="user/{{member}}"><h4>{{member}}</h4></a>
    {%endfor%}
{% endblock desc %}

{% block leave_delete %}
    <form action='/delete_chat/{{chat.id}}' target="_blank">
       <button>Leave and delete</button>
    </form>
{% endblock leave_delete %}
