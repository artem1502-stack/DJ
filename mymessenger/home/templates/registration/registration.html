{% extends "base.html" %}


{% block title %}
    Registration
{% endblock title %}

<h1>Registration</h1>

{% block data %}
    {% for user in users %}
        <h4>User: {{ user }}</h4>
    {% endfor %}
{% endblock data %}

{% block form %}
    <form method="POST">
        {{user_registration_form.as_p}}
        {% csrf_token %}
        <input type="submit" value="send">
    </form>
{% endblock form %}
